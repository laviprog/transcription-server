services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - speech-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - speech-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: speech-app:latest
    env_file:
      - .env
    command: [ "uv", "run", "alembic", "upgrade", "head" ]
    networks:
      - speech-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: speech-app:latest
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/transcribe:/srv/transcribe
    networks:
      - speech-network
    environment:
      - TRANSCRIBE_TMP_DIR=/srv/transcribe
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      # dockerfile: docker/Dockerfile.worker.cuda
      dockerfile: docker/Dockerfile.worker
    image: speech-worker:latest
    env_file:
      - .env
    volumes:
      - ./data/transcribe:/srv/transcribe
    networks:
      - speech-network
    environment:
      - TRANSCRIBE_TMP_DIR=/srv/transcribe
    #  - NVIDIA_VISIBLE_DEVICES=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: ["gpu"]
    #           device_ids: ["0"]

networks:
  speech-network:
    name: speech-network
    driver: bridge
