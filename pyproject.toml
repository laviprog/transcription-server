[project]
name = "transcription-server"
version = "1.0.0"
description = "Transcription Server is a fast and fault-tolerant service for working with STT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "celery>=5.6.3",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "redis>=8.1.0",
    "advanced-alchemy>=1.6.3",
    "asyncpg>=0.31.0",
    "celery-types>=0.23.0",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "mutagen>=1.48.1",
    "python-multipart>=0.0.32",
    "scalar-fastapi>=1.9.0",
]

worker = [
    "whisperx==3.8.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "TCH", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/**/models.py" = ["TC001", "TC002", "TC003"]
"src/database/mixins/*.py" = ["TC001", "TC002", "TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
